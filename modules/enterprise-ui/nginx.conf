server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/... and nginx forwards to the
    # adapter container. No CORS, no backend hostname baked into the UI image.
    location /api/ {
        # Resolve the upstream lazily via Docker's embedded DNS so nginx starts
        # even if the adapter container isn't up yet, and reconnects when it is.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $adapter_upstream http://adapter:7900;
        proxy_pass $adapter_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
